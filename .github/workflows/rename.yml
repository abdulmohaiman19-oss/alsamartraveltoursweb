name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "abdulmohaiman19-oss"
          git config user.email "abdulmohaiman19-oss@users.noreply.github.com"
          git mv al-samar-index.html index.html
          git commit -m "Rename al-samar-index.html to index.html"
          git push
